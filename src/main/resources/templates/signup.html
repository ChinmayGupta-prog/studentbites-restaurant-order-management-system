<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign Up')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<aside th:replace="~{fragments/layout :: cartDrawer}"></aside>
<nav th:replace="~{fragments/layout :: mobileBottomNav}"></nav>
<div th:replace="~{fragments/layout :: toast}"></div>

<main class="page-shell auth-shell">
    <section class="auth-card reveal">
        <span class="eyebrow">Student account</span>
        <h1>Create your account</h1>
        <p>Your orders, cart and tracking details stay linked to this student account.</p>
        <form th:action="@{/signup}" th:object="${signupForm}" method="post" class="form-grid">
            <input th:field="*{fullName}" placeholder="Full name" required>
            <input th:field="*{email}" type="email" placeholder="Email" autocomplete="email" required>
            <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</small>
            <input th:field="*{phone}" placeholder="Phone" required>
            <input th:field="*{hostelOrClass}" placeholder="Hostel / classroom">
            <div class="password-field">
                <input th:field="*{password}" type="password" placeholder="Password" autocomplete="new-password" required data-password-input>
                <button type="button" data-password-toggle aria-label="Show password">
                    <span class="material-symbols-rounded">visibility</span>
                </button>
            </div>
            <small class="field-error" th:if="${#fields.hasErrors('passwordLengthValid')}" th:errors="*{passwordLengthValid}" role="alert">Password length error</small>
            <button class="btn primary full" type="submit">
                <span class="material-symbols-rounded">person_add</span>
                Sign Up
            </button>
        </form>
        <a class="auth-link" th:href="@{/login}">Already have an account? Login</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
